# Builds the Windows installer and the Android APK for a release tag (v1.6.0) and publishes them as a GitHub release.
# The apps update themselves from the latest release (web/src/lib/updates.ts): the files keep their names
# (*-Windows.exe, *-Android.apk, and *-AndroidAuto.apk for Musike Video in the car), and the version in the tag must
# be the one in the package.json files.
#
# The APK is signed with the key in these repository secrets (Settings → Secrets and variables → Actions):
#   MUSIKE_KEYSTORE_BASE64    the .jks file, base64-encoded
#   MUSIKE_KEYSTORE_PASSWORD  MUSIKE_KEY_ALIAS  MUSIKE_KEY_PASSWORD
# Always the same key: Android only installs an update signed like the version already on the phone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter musike-desktop dist
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Windows"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Windows.exe 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Windows.exe, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # Its own app ID: installs next to other builds of Musike, and updates only from this repository's releases.
      MUSIKE_APP_ID: app.musike.android.cetox
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::MUSIKE_KEYSTORE_BASE64 is not set: the APK will be unsigned and won't install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musike-release.jks"
          echo "MUSIKE_KEYSTORE=$RUNNER_TEMP/musike-release.jks" >> "$GITHUB_ENV"
      - run: pnpm --filter @musike/mobile apk
        env:
          MUSIKE_KEYSTORE_PASSWORD: ${{ secrets.MUSIKE_KEYSTORE_PASSWORD }}
          MUSIKE_KEY_ALIAS: ${{ secrets.MUSIKE_KEY_ALIAS }}
          MUSIKE_KEY_PASSWORD: ${{ secrets.MUSIKE_KEY_PASSWORD }}
      - name: Check downloads
        shell: bash
        run: |
          { echo "### Android"; ls release | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          found=$(ls release/*-Android.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-Android.apk, found $found"; ls -l release; exit 1; }
          found=$(ls release/*-AndroidAuto.apk 2>/dev/null | wc -l)
          [ "$found" -eq 1 ] || { echo "::error::Expected 1 file(s) matching *-AndroidAuto.apk, found $found"; ls -l release; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: release/*
          if-no-files-found: error

  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: downloads/*
          fail_on_unmatched_files: true
