# Musike on any machine with Docker: docker compose up -d, then open http://<this machine>:4180
services:
  musike:
    image: ghcr.io/yourboiava/musike:latest # this fork; ghcr.io/ernani1234/musike is the original
    # Or build it from this folder instead (then: docker compose up -d --build):
    # build: .
    container_name: musike
    ports:
      - "4180:4180"
    volumes:
      - musike-data:/data # library: playlists, favorites, history
      - musike-cache:/cache # HD videos already downloaded
    environment:
      # Accounts, each with its own library: open Musike right away and create the admin.
      MUSIKE_AUTH: "on"
      # Audio straight from YouTube, about half a second to start; yt-dlp when that's refused.
      MUSIKE_DIRECT_AUDIO: "first"
      # Your country, for search results (the default is BR).
      MUSIKE_LOCATION: "IT"
      # yt-dlp gets YouTube's proof-of-origin tokens from the "pot" service below. Cookies, if you add them, go
      # in the same line: "--extractor-args ... --cookies /data/cookies.txt".
      YTDLP_EXTRA_ARGS: "--extractor-args youtubepot-bgutilhttp:base_url=http://pot:4416"
      # HD video cache, in MB.
      MUSIKE_CACHE_MAX_MB: "2048"
      # More in the README's Configuration table, for example:
      # YTDLP_CHANNEL: "nightly"   # keeps yt-dlp up to date on that channel
      # MUSIKE_TRUST_PROXY: "true" # behind a reverse proxy
    depends_on: [pot]
    restart: unless-stopped
    # Nothing in Musike needs root's powers: none are given, and none can be gained later.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Proof-of-origin tokens for yt-dlp, so YouTube asks less often to "confirm you're not a bot" (VPNs, shared
  # networks). Optional: without it Musike works the same, only bot-checked more often. Keep the version in step with
  # BGUTIL_VERSION in the Dockerfile.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: musike-pot
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  musike-data:
  musike-cache:
